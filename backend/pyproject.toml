[project]
name = "lecturenote-backend"
version = "0.1.0"
description = "Auto-annotate lecture slides from a lecture recording"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "faster-whisper>=1.1",
    "google-genai>=1.0",
    "numpy>=1.26",
    "openai>=1.50",
    "pydantic>=2.8",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "sentence-transformers>=3.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
