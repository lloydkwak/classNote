[project]
name = "lecturenote-backend"
version = "0.1.0"
description = "Auto-annotate lecture slides from a lecture recording"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "av==18.1.0",  # faster-whisper decode_audio compatibility (19.x metadata_errors regression)
    "fastapi>=0.115",
    "faster-whisper>=1.1",
    "google-genai>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "openai>=1.50",
    "perfect-freehand>=1.2.0",
    "pydantic>=2.8",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.0",
    "rank-bm25>=0.2",
    "rapidfuzz>=3.14.6",
    "sentence-transformers>=3.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
ocr = [
    "onnxruntime>=1.31.1",
    "rapidocr>=3.10.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
